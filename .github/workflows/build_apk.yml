name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Restore google-services.json
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        shell: bash
        env: 
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if echo "$GOOGLE_SERVICES_JSON" | base64 -d > /dev/null 2>&1 && \
             echo "$GOOGLE_SERVICES_JSON" | base64 -d | grep -q '"project_info"'; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
            echo "Restaurado desde base64"
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Restaurado desde JSON directo"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
